<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Controller</title>

<link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=1">
<link rel="shortcut icon" href="./favicon.png?v=1">

<style>
body {
  margin: 0;
  background: #111827;
  color: #f3f4f6;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  gap: 10px;
}

h2 { color: #93c5fd; letter-spacing: 1px; margin: 0; }

.badge {
  font-size: 2em;
  font-weight: bold;
  color: #fbbf24;
  min-width: 120px;
  text-align: center;
}

svg { overflow: visible; }

@keyframes spin { to { transform: rotate(360deg); } }

#blades {
  transform-origin: 60px 60px;
  animation: spin var(--dur, 0s) linear infinite;
}

.btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
}

button {
  padding: 12px 22px;
  font-size: 1em;
  font-weight: bold;
  border: 2px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  transition: .15s;
}
button:hover    { filter: brightness(1.15); }
button:disabled { opacity: .5; cursor: not-allowed; filter: none; }

.b0 { background: #374151; color: #d1d5db; }
.b1 { background: #059669; color: #fff; }
.b2 { background: #d97706; color: #fff; }
.b3 { background: #dc2626; color: #fff; }

button.active { border-color: #fff; box-shadow: 0 0 0 2px #fff4; }

/* Status row */
.status-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  font-size: .85em;
  color: #6b7280;
  min-height: 20px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  background: #4b5563;
  transition: background .3s;
}
.dot.ok      { background: #059669; }
.dot.pending { background: #d97706; }
.dot.err     { background: #dc2626; }

/* Cooldown bar — shows the 15 s write throttle visually */
.cooldown-wrap {
  width: 220px;
  height: 4px;
  background: #1f2937;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.cooldown-bar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
  border-radius: 2px;
  transition: width .25s linear;
}

.info {
  font-size: .75em;
  color: #4b5563;
  max-width: 340px;
  text-align: center;
  margin-top: 4px;
}
</style>
</head>

<body>

<h2>🌀 Wi-Fi Ceiling Fan</h2>

<div class="badge" id="lbl">--</div>

<svg viewBox="0 0 120 120" width="150" height="150">
  <circle cx="60" cy="60" r="6" fill="#fbbf24" opacity=".6"/>
  <g id="blades" style="--dur:0s">
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(90 60 60)"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(180 60 60)"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(270 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="5" fill="#fbbf24"/>
</svg>

<div class="btns">
  <button class="b0" onclick="send(0)">OFF</button>
  <button class="b1" onclick="send(1)">LOW</button>
  <button class="b2" onclick="send(2)">MEDIUM</button>
  <button class="b3" onclick="send(3)">HIGH</button>
</div>

<div class="status-row">
  <span class="dot" id="dot"></span>
  <span id="status">Loading current speed...</span>
</div>

<!-- Visual indicator: fills up during the 15 s write cooldown -->
<div class="cooldown-wrap" title="ThingSpeak write cooldown (15 s)">
  <div class="cooldown-bar" id="cdbar"></div>
</div>

<div class="info">EE427 — Wi-Fi Ceiling Fan Simulator | ThingSpeak Cloud</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────
const TS_WRITE_KEY = "P49N9THD223T0OQ2";
const TS_READ_KEY  = "S4H8NAMA81TVAE79";
const TS_CHANNEL   = 3322916;
const COOLDOWN_MS  = 16000;   // ThingSpeak free-tier write limit
// ─────────────────────────────────────────────────────────────

const NAMES = ["OFF", "LOW", "MEDIUM", "HIGH"];
const DURS  = ["0s", "2.5s", "1.2s", "0.45s"];

let lastSendTime  = 0;     // timestamp of last successful write
let cooldownTimer = null;

// ── UI helpers ────────────────────────────────────────────────
function setStatus(msg, state = "") {
  document.getElementById("status").textContent = msg;
  document.getElementById("dot").className = "dot" + (state ? " " + state : "");
}

function updateUI(speed) {
  document.getElementById("lbl").textContent = NAMES[speed];
  document.getElementById("blades").style.setProperty("--dur", DURS[speed]);
  document.querySelectorAll("button").forEach((b, i) =>
    b.classList.toggle("active", i === speed));
}

function lockButtons(locked) {
  document.querySelectorAll("button").forEach(b => b.disabled = locked);
}

// ── Cooldown bar animation ────────────────────────────────────
function startCooldown() {
  const bar   = document.getElementById("cdbar");
  const start = performance.now();
  if (cooldownTimer) cancelAnimationFrame(cooldownTimer);

  function tick(now) {
    const pct = Math.min(100, ((now - start) / COOLDOWN_MS) * 100);
    bar.style.width = pct + "%";
    if (pct < 100) cooldownTimer = requestAnimationFrame(tick);
    else bar.style.width = "0%";
  }
  cooldownTimer = requestAnimationFrame(tick);
}

// ── Send command to ThingSpeak field3 ─────────────────────────
// The ESP32 polls field3 every 2 s → latency ≈ 0–2 s.
async function send(speed) {
  const now = Date.now();
  const msSinceLast = now - lastSendTime;

  if (msSinceLast < COOLDOWN_MS && lastSendTime !== 0) {
    const wait = Math.ceil((COOLDOWN_MS - msSinceLast) / 1000);
    setStatus(`Please wait ${wait}s before sending again`, "pending");
    return;
  }

  // Optimistic UI update — no waiting for network
  updateUI(speed);
  lockButtons(true);
  setStatus("Sending command...", "pending");

  try {
    const url = `https://api.thingspeak.com/update?api_key=${TS_WRITE_KEY}&field3=${speed}`;
    const r   = await fetch(url);
    const txt = await r.text();

    if (parseInt(txt) > 0) {
      lastSendTime = Date.now();
      startCooldown();
      setStatus("Command sent ✓ — fan updates within ~2 s", "ok");
    } else {
      // ThingSpeak returned 0 = rate limited
      setStatus("ThingSpeak rate limit hit — wait 15 s", "err");
    }
  } catch (e) {
    setStatus("Network error: " + e.message, "err");
  }

  lockButtons(false);
}

// ── Load current speed on page open ──────────────────────────
// Reads field1, which the ESP32 mirrors after every speed change.
async function loadCurrent() {
  try {
    const url = `https://api.thingspeak.com/channels/${TS_CHANNEL}/fields/1/last.json?api_key=${TS_READ_KEY}`;
    const r   = await fetch(url);
    const j   = await r.json();
    const spd = parseInt(j.field1, 10);

    if (!isNaN(spd) && spd >= 0 && spd <= 3) {
      updateUI(spd);
      setStatus("Current speed loaded ✓", "ok");
    } else {
      setStatus("Connected — tap a button to control", "");
    }
  } catch {
    setStatus("Could not reach ThingSpeak", "err");
  }
}

loadCurrent();
</script>
</body>
</html>
