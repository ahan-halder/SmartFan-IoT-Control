<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Controller</title>
<style>
  body { margin: 0; background: #111827; color: #f3f4f6; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 10px; }
  h2 { color: #93c5fd; letter-spacing: 1px; margin: 0; }
  .badge { font-size: 2em; font-weight: bold; color: #fbbf24; min-width: 120px; text-align: center; }
  svg { overflow: visible; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #blades { transform-origin: 60px 60px; animation: spin var(--dur, 0s) linear infinite; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  button { padding: 12px 22px; font-size: 1em; font-weight: bold; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: .15s; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: not-allowed; filter: none; }
  .b0 { background: #374151; color: #d1d5db; }
  .b1 { background: #059669; color: #fff; }
  .b2 { background: #d97706; color: #fff; }
  .b3 { background: #dc2626; color: #fff; }
  button.active { border-color: #fff; box-shadow: 0 0 0 2px #fff4; }
  .status-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: .85em; color: #6b7280; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: #4b5563; transition: background .3s; }
  .dot.ok { background: #059669; }
  .dot.pending { background: #d97706; }
  .dot.err { background: #dc2626; }
  .cooldown-wrap { width: 220px; height: 4px; background: #1f2937; border-radius: 2px; overflow: hidden; margin-top: 4px; }
  .cooldown-bar { height: 100%; width: 0%; background: #3b82f6; border-radius: 2px; transition: width .25s linear; }
  .info { font-size: .75em; color: #4b5563; max-width: 340px; text-align: center; margin-top: 4px; }
</style>
</head>

<body>
<h2>🌀 Wi-Fi Ceiling Fan</h2>
<div class="badge" id="lbl">--</div>

<svg viewBox="0 0 120 120" width="150" height="150">
  <circle cx="60" cy="60" r="6" fill="#fbbf24" opacity=".6"/>
  <g id="blades" style="--dur:0s">
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(90 60 60)"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(180 60 60)"/>
    <ellipse cx="60" cy="28" rx="9" ry="24" fill="#60a5fa" opacity=".8" transform="rotate(270 60 60)"/>
  </g>
  <circle cx="60" cy="60" r="5" fill="#fbbf24"/>
</svg>

<div class="btns">
  <button class="b0" onclick="send(0)">OFF</button>
  <button class="b1" onclick="send(1)">LOW</button>
  <button class="b2" onclick="send(2)">MEDIUM</button>
  <button class="b3" onclick="send(3)">HIGH</button>
</div>

<div class="status-row">
  <span class="dot" id="dot"></span>
  <span id="status">Syncing with hardware...</span>
</div>

<div class="cooldown-wrap"><div class="cooldown-bar" id="cdbar"></div></div>
<div class="info">EE427 — Secure IoT Control | Vercel Proxy</div>

<script>
const COOLDOWN_MS = 16000;
const NAMES = ["OFF", "LOW", "MEDIUM", "HIGH"];
const DURS  = ["0s", "2.5s", "1.2s", "0.45s"];

let lastSendTime = 0;
let cooldownTimer = null;

function setStatus(msg, state = "") {
  document.getElementById("status").textContent = msg;
  document.getElementById("dot").className = "dot" + (state ? " " + state : "");
}

function updateUI(speed) {
  document.getElementById("lbl").textContent = NAMES[speed];
  document.getElementById("blades").style.setProperty("--dur", DURS[speed]);
  document.querySelectorAll("button").forEach((b, i) => b.classList.toggle("active", i === speed));
}

function startCooldown() {
  const bar = document.getElementById("cdbar");
  const start = performance.now();
  if (cooldownTimer) cancelAnimationFrame(cooldownTimer);
  function tick(now) {
    const pct = Math.min(100, ((now - start) / COOLDOWN_MS) * 100);
    bar.style.width = pct + "%";
    if (pct < 100) cooldownTimer = requestAnimationFrame(tick);
    else bar.style.width = "0%";
  }
  cooldownTimer = requestAnimationFrame(tick);
}

async function send(speed) {
  const now = Date.now();
  if (now - lastSendTime < COOLDOWN_MS && lastSendTime !== 0) return;

  updateUI(speed);
  setStatus("Sending securely...", "pending");

  try {
    // Calling your local serverless function
    const r = await fetch(`/api/update?speed=${speed}`);
    const txt = await r.text();

    if (parseInt(txt) > 0) {
      lastSendTime = Date.now();
      startCooldown();
      setStatus("Command sent ✓", "ok");
    } else {
      setStatus("Rate limited — wait 15s", "err");
    }
  } catch (e) {
    setStatus("Connection error", "err");
  }
}

async function loadCurrent() {
  try {
    const r = await fetch(`/api/status`);
    const j = await r.json();
    const spd = parseInt(j.field1, 10);
    if (!isNaN(spd)) updateUI(spd);
    setStatus("System ready", "ok");
  } catch {
    setStatus("Hardware offline", "err");
  }
}

loadCurrent();
</script>
</body>
</html>
